<div class="dashboard-container">
  
  <mat-card class="header-card">
    <mat-card-header>
      <mat-card-title>Olá! Bem-vindo ao Sistema de Gestão de Pedidos.</mat-card-title>
      <mat-card-subtitle>
        Aqui você monitora o status dos pedidos e gerencia as entregas. 
        Lembre-se: o limite máximo é de 5 pedidos simultâneos no sistema.
      </mat-card-subtitle>
    </mat-card-header>
    <mat-card-actions>
      <button mat-button color="primary" routerLink="/listagem">Ver Pedidos</button>
      <button mat-button color="accent" routerLink="/cadastro">Novo Pedido</button>
    </mat-card-actions>
  </mat-card>

  <div class="charts-row">
    <mat-card class="chart-card">
      <mat-card-header>
        <mat-card-title>Pedidos por Status</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <canvas baseChart 
          [data]="barChartData" 
          [options]="barChartOptions" 
          [type]="barChartType">
        </canvas>
      </mat-card-content>
    </mat-card>

    <mat-card class="chart-card">
      <mat-card-header>
        <mat-card-title>Capacidade (Limite de 5)</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <canvas baseChart 
          [data]="pieChartData" 
          [options]="pieChartOptions" 
          [type]="pieChartType">
        </canvas>
      </mat-card-content>
    </mat-card>
  </div>

</div>
