<div class="listagem-container">
  <div class="header-actions">
    <h2>Listagem de Pedidos</h2>
    <div>
      <button mat-button routerLink="/dashboard">Voltar ao Dashboard</button>
      <button mat-flat-button color="primary" routerLink="/cadastro" [disabled]="!podeAdicionar()">
        Adicionar Pedido
      </button>
    </div>
  </div>

  <div class="filtros-container">
    <mat-form-field appearance="outline" class="filtro-busca">
      <mat-label>Buscar por cliente</mat-label>
      <input matInput [(ngModel)]="filtroBusca" (ngModelChange)="aplicarFiltro()" placeholder="Nome do cliente">
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>

    <mat-form-field appearance="outline" class="filtro-status">
      <mat-label>Filtrar por status</mat-label>
      <mat-select [(ngModel)]="filtroStatus" (ngModelChange)="aplicarFiltro()">
        <mat-option value="">Todos</mat-option>
        <mat-option *ngFor="let s of statusOpcoes" [value]="s">{{s}}</mat-option>
      </mat-select>
    </mat-form-field>

    <button mat-button (click)="limparFiltros()" *ngIf="filtroBusca || filtroStatus">
      Limpar filtros
    </button>
  </div>

  <div class="spinner-container" *ngIf="carregando">
    <mat-spinner diameter="48"></mat-spinner>
  </div>

  <ng-container *ngIf="!carregando">
    <table mat-table [dataSource]="pedidosData" class="mat-elevation-z8" matSort>

      <ng-container matColumnDef="cliente">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Cliente </th>
        <td mat-cell *matCellDef="let p"> {{p.displayName}} </td>
      </ng-container>

      <ng-container matColumnDef="itens">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Itens </th>
        <td mat-cell *matCellDef="let p"> {{p.itens}} </td>
      </ng-container>

      <ng-container matColumnDef="peso">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Peso (kg) </th>
        <td mat-cell *matCellDef="let p"> {{(p.peso / 1000) | number:'1.2-2'}} </td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Status </th>
        <td mat-cell *matCellDef="let p">
          <span class="status-badge" [ngClass]="'status-' + p.status">{{p.status}}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="acoes">
        <th mat-header-cell *matHeaderCellDef> Ações </th>
        <td mat-cell *matCellDef="let p">
          <button mat-button color="primary" *ngIf="podeMudarStatus(p.status, 'EM_PROCESSAMENTO')" (click)="alterarStatus(p.id, 'EM_PROCESSAMENTO')">Processar</button>
          <button mat-button color="accent" *ngIf="podeMudarStatus(p.status, 'PAUSADO')" (click)="alterarStatus(p.id, 'PAUSADO')">Pausar</button>
          <button mat-button color="warn" *ngIf="podeMudarStatus(p.status, 'CANCELADO')" (click)="alterarStatus(p.id, 'CANCELADO')">Cancelar</button>
          <button mat-icon-button color="warn" (click)="excluir(p.id)" title="Excluir">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons class="mat-elevation-z8"></mat-paginator>
  </ng-container>
</div>
