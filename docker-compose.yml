version: '3.8'

services:
  backend:
    build:
      context: ./backend
    container_name: desafio-claro-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=default
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: desafio-claro-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    restart: unless-stopped
